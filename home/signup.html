<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Harry Potter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body class="signup-body">
    <!--Back Button-->
    <a href="index.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
    <div class="signup-container">
        <!--Logo-->
        <img src="logo.png" alt="Harry Potter">
        <!--Section Title-->
        <div class="title-with-lines">
            <span></span>
            <h2>Sign Up</h2>
            <span></span>
        </div>
        <p class="subtitle">Enjoy magical features including the official sorting ceremony, portrait maker and more!</p>
        <!--Sign Up Forms-->
        <form id="signup-form" class="signup-form">
            <div class="form-group">
                <label for="dob">DATE OF BIRTH</label>
                <input type="text" id="dob" placeholder="DD/MM/YYYY" required>
            </div>
            <div class="form-group">
                <label for="email">EMAIL ADDRESS</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">PASSWORD</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required>
                    <i class="fa-regular fa-eye" id="togglePassword"></i>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">FIRST NAME</label>
                        <input type="text" id="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">LAST NAME</label>
                        <input type="text" id="lastName" required>
                    </div>
                </div>
            </div>
            <p class="terms-text">By proceeding you agree to our <a href="#">Terms of Use</a> and acknowledge our <a
                    href="#">Privacy Policy</a>.</p>
            <button type="submit" class="btn-solid-blue btn-full">SIGN UP</button>
            <p>Already have an account?</p>
            <button class="btn btn-outline btn-full" onclick="">LOGIN</button>
            </p>
            <div class="change-language">
                <i class="fa-solid fa-globe"></i>CHANGE LANGUAGE
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>

</html>
